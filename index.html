<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>Stability — Level One</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#172033;background:#f5f5f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:560px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(100px + env(safe-area-inset-bottom))}.eyebrow{font-size:12px;letter-spacing:.11em;font-weight:750;color:#778094;text-transform:uppercase}.header{display:flex;justify-content:space-between;align-items:center;margin:0 0 23px}.brand{font-size:20px;font-weight:800;letter-spacing:-.045em}.pill{background:#e5edff;color:#2259bb;border-radius:30px;padding:8px 12px;font-size:12px;font-weight:750}.hero{padding:3px 2px 19px}h1{font-size:37px;line-height:1.08;letter-spacing:-.055em;margin:9px 0 9px}h2{font-size:21px;letter-spacing:-.035em;margin:0 0 8px}p{line-height:1.5} .muted{color:#717a8a}.small{font-size:13px}.surface{background:white;border-radius:23px;padding:19px;margin:12px 0;box-shadow:0 2px 14px #1c35520a}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.bar{height:9px;background:#e9edf3;border-radius:40px;overflow:hidden;margin:14px 0 8px}.bar>div{height:100%;background:#3478f6;border-radius:40px;transition:width .3s}.button{border:0;border-radius:15px;background:#e9edf4;color:#253148;font-weight:750;padding:14px 16px}.primary{background:#3478f6;color:white}.green{background:#e5f8ed;color:#148044}.red{background:#fff0ef;color:#ad3c35}.full{width:100%}.exercise{padding:0;overflow:hidden}.exercise-head{border:0;background:none;text-align:left;width:100%;padding:18px;display:flex;align-items:center;gap:13px}.exercise-icon{width:46px;height:46px;border-radius:16px;background:#edf3ff;display:grid;place-items:center;font-size:20px;font-weight:750;color:#3974d9;flex-shrink:0}.exercise-title{font-size:17px;font-weight:760;letter-spacing:-.025em}.exercise-sub{font-size:12px;color:#758095;margin-top:5px}.status{margin-left:auto;font-size:20px;color:#9aa4b4}.exercise-body{padding:0 18px 19px;border-top:1px solid #f1f2f5}.kicker{font-size:11px;font-weight:780;letter-spacing:.09em;color:#7e899c;text-transform:uppercase;margin:18px 0 5px}.detail{font-size:14px;line-height:1.55;margin:0}.timer{font-size:58px;font-weight:800;text-align:center;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:17px 0 2px}.timer-note{text-align:center;font-size:12px;color:#778094;margin-bottom:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{min-width:0}.notice{background:#edf3ff;border-radius:17px;padding:14px 15px;font-size:13px;line-height:1.5;color:#3d5478}.warning{background:#fff3ed;color:#97532b}.checkpoint{display:flex;flex-direction:column;align-items:center;text-align:center}.flex{border:0;background:#f0f2f5;border-radius:25px;width:94px;height:94px;font-size:53px;filter:grayscale(1);opacity:.48;margin:12px 0 13px;transition:.25s}.flex.ready{opacity:1;filter:grayscale(.7)}.flex.approved{filter:none;opacity:1;background:#e5f8ed}.tabbar{position:fixed;bottom:0;left:0;right:0;padding:10px max(18px,calc((100vw - 520px)/2)) calc(10px + env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(16px);border-top:1px solid #e9edf3;display:grid;grid-template-columns:repeat(3,1fr);z-index:10}.tab{border:0;background:transparent;color:#8892a2;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700}.tab b{font-size:22px}.tab.active{color:#3478f6}.hidden{display:none!important}.entry{padding:12px 0;border-bottom:1px solid #edf0f5;font-size:14px}.entry:last-child{border:0}.badge{border-radius:50px;background:#f1f4f8;padding:6px 9px;font-size:12px;font-weight:700;color:#536176}.fine{font-size:12px;color:#778094;line-height:1.5}.separator{height:1px;background:#edf0f5;margin:15px 0}.checkbox{display:flex;align-items:flex-start;gap:9px;text-align:left;font-size:13px;color:#47546b}.checkbox input{margin-top:3px}textarea{width:100%;border:1px solid #dfe4ec;border-radius:13px;padding:12px;font:inherit;font-size:14px;min-height:75px;resize:vertical}.label{font-size:13px;font-weight:700;margin:12px 0 7px;display:block}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#172033;color:white;border-radius:20px;padding:10px 16px;font-size:13px;z-index:30;display:none;white-space:nowrap;max-width:95vw}a{color:#3478f6} .secondary-link{border:0;background:transparent;color:#65728a;padding:10px;font-size:13px}
</style></head><body><div class="app"><header class="header"><div class="brand">✳ Stability</div><div class="pill">MULDOWNEY · L1</div></header><section id="today"></section><section id="progress" class="hidden"></section><section id="levels" class="hidden"></section></div><nav class="tabbar"><button class="tab active" data-tab="today" onclick="navigate('today')"><b>◉</b>Today</button><button class="tab" data-tab="progress" onclick="navigate('progress')"><b>▥</b>Progress</button><button class="tab" data-tab="levels" onclick="navigate('levels')"><b>▤</b>Levels</button></nav><div class="toast" id="toast"></div><script>
const EX=[
{name:'Bridging',feel:'Glutes and hamstrings.',how:'On your back with knees bent and feet hip-width apart, squeeze the glutes and lift your pelvis. Hold 5 seconds; lower and relax 1 second; repeat.',watch:'Keep your hips facing forward without rolling outward. If hamstrings cramp, squeeze glutes before lifting. Ask your PT about glute sets if cramps persist.',cycle:'5-second hold · 1-second rest'},
{name:'Supine Marches',feel:'Deep abdominal muscles and hip flexors.',how:'On your back, knees bent and feet hip-width apart, find a comfortable position between fully arched and flattened. Brace your abdomen. Lift one foot 1–2 inches, hold 5 seconds, lower, then switch. Maintain the brace.',watch:'Do not force the spine flat or arched. Stop if it causes low-back or hip pain; ask your PT about the book’s abdominal-bracing or heel/toe-up alternatives.',cycle:'5-second hold · alternate legs'},
{name:'Prone Hip Extension',feel:'Low-back stabilizers, with the glutes engaging.',how:'Lie on your stomach with a pillow under your hips and a towel roll under your forehead. Keep arms by your sides. Lift one leg only until the glute engages, hold 5 seconds, then switch.',watch:'Keep your head facing down and your back from arching. Do not lift the leg high. Ask your PT about the supported-ball alternative if prone positioning hurts.',cycle:'5-second hold · alternate legs'},
{name:'Ball Squeezes',feel:'Inner thigh muscles.',how:'On your back with knees bent and feet hip-width apart, place a soccer-ball-size ball between your thighs. Squeeze 5 seconds, release 1 second, repeat.',watch:'Keep knees and feet approximately hip-width apart. If knees hurt, move the ball down toward the inner thighs.',cycle:'5-second squeeze · 1-second rest'},
{name:'Clam With Tubing',feel:'Outer hip muscles.',how:'On your back with knees bent, put yellow resistance tubing around your thighs. Open both knees just a few inches, hold 5 seconds, and return slowly to hip-neutral without letting knees touch.',watch:'Avoid opening too far or letting knees collapse inward. The book specifies a tied yellow band approximately 9–10 inches long.',cycle:'5-second hold · controlled return'}
];
const KEY='stability_muldowney_v2'; const oldKey='muldowneyL1';
function fresh(){return {session:1,history:[],done:[false,false,false,false,false],flags:[false,false,false,false,false],notes:['','','','',''],approved:false,open:0,tab:'today'}}
let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){s=fresh()} if(!Array.isArray(s.history))s=fresh();
let timer={id:null,index:-1,remaining:90,running:false};
const target=()=>Math.min(90+10*(s.session-1),180),fmt=v=>`${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`,doneCount=()=>s.done.filter(Boolean).length,atGoal=()=>s.history.some(h=>h.seconds===180&&h.done.every(Boolean)&&!h.flags.some(Boolean)),eligible=()=>atGoal()&&!s.approved;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function notify(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>t.style.display='none',2400)}
function navigate(tab){s.tab=tab;persist();render();window.scrollTo(0,0)}
function openExercise(i){if(timer.running&&timer.index!==i){notify('Pause your current timer first');return}s.open=s.open===i?-1:i;persist();render()}
function stopTimer(){if(timer.id)clearInterval(timer.id);timer.id=null;timer.running=false}
function toggleTimer(i){if(timer.running){stopTimer();render();return}if(timer.index!==i){timer.index=i;timer.remaining=target()}timer.running=true;timer.id=setInterval(()=>{timer.remaining=Math.max(0,timer.remaining-1);const el=document.getElementById('clock'+i);if(el)el.textContent=fmt(timer.remaining);if(timer.remaining===0){stopTimer();notify('Timer finished. Check your symptoms.');render()}},1000);render()}
function resetTimer(i){stopTimer();timer.index=i;timer.remaining=target();render()}
function toggleDone(i){if(s.flags[i]&&!s.done[i]){notify('Resolve pain flag with your PT before completing');return}s.done[i]=!s.done[i];persist();render()}
function flag(i){s.flags[i]=!s.flags[i];if(s.flags[i]){s.done[i]=false;stopTimer()}persist();render()}
function updateNote(i,v){s.notes[i]=v;persist()}
function finishSession(){if(doneCount()!==5||s.flags.some(Boolean)){notify('Complete all five without unresolved pain flags');return}let sec=target();s.history.push({date:new Date().toLocaleDateString(),seconds:sec,done:[...s.done],flags:[...s.flags],notes:[...s.notes]});s.done=[false,false,false,false,false];s.flags=[false,false,false,false,false];s.notes=['','','','',''];s.open=0;stopTimer();timer.index=-1;if(sec<180)s.session++;persist();render();navigate('progress');notify(sec===180?'Level 1 goal reached. PT check-in next.':'Session saved. Next target increased by 10 seconds.')}
function approval(){if(s.approved){notify('PT approval already recorded');return}if(!eligible()){notify('Finish a symptom-free 3:00 session first');return}if(confirm('Has your physical therapist reviewed your technique and explicitly approved progressing to Level 2 Mat?')){s.approved=true;persist();render();notify('PT approval recorded. Level 2 unlocked!')}}
function renderToday(){let sec=target(),n=doneCount();document.getElementById('today').innerHTML=`<div class="hero"><div class="eyebrow">SI joint + lumbar spine</div><h1>Today's session</h1><div class="muted">Level 1 Mat · Session ${s.session} · ${fmt(sec)} per exercise</div></div><div class="surface"><div class="row"><strong>Session progress</strong><span class="badge">${n} of 5</span></div><div class="bar"><div style="width:${n*20}%"></div></div><div class="row small muted"><span>Complete each movement</span><span>${Math.round(n*20)}%</span></div></div><div class="notice">Start at <b>1:30 per exercise</b> and increase by <b>10 seconds after each fully completed session</b>, up to 3:00. This tracker does not automatically progress if you flag symptoms. Stop painful movements and review with your PT.</div><div class="eyebrow" style="margin:25px 3px 9px">Your exercises</div>${EX.map((e,i)=>`<article class="surface exercise"><button class="exercise-head" onclick="openExercise(${i})" aria-expanded="${s.open===i}"><span class="exercise-icon">${String(i+1).padStart(2,'0')}</span><span style="flex:1"><div class="exercise-title">${e.name}</div><div class="exercise-sub">${fmt(sec)} · ${e.cycle}</div></span><span class="status">${s.flags[i]?'⚑':s.done[i]?'✅':s.open===i?'⌃':'⌄'}</span></button>${s.open===i?`<div class="exercise-body"><div class="timer" id="clock${i}">${fmt(timer.index===i?timer.remaining:sec)}</div><div class="timer-note">${e.cycle} · follow your own holds while timer runs</div><div class="actions"><button class="button primary" onclick="toggleTimer(${i})">${timer.running&&timer.index===i?'Pause timer':'▶ Start timer'}</button><button class="button" onclick="resetTimer(${i})">Reset</button></div><div class="kicker">How to do it</div><p class="detail">${e.how}</p><div class="kicker">You should feel</div><p class="detail">${e.feel}</p><div class="kicker">Watch for</div><p class="detail">${e.watch}</p><label class="label" for="note${i}">Optional notes for your PT</label><textarea id="note${i}" placeholder="How did this feel?" oninput="updateNote(${i},this.value)">${escapeHTML(s.notes[i]||'')}</textarea><div class="actions" style="margin-top:12px"><button class="button ${s.flags[i]?'red':''}" onclick="flag(${i})">${s.flags[i]?'⚑ Remove flag':'⚑ Flag symptoms'}</button><button class="button ${s.done[i]?'green':'primary'}" onclick="toggleDone(${i})">${s.done[i]?'✓ Completed':'Mark complete'}</button></div>${s.flags[i]?'<p class="fine" style="color:#a34a3c">Flagged. Do not progress this exercise until your PT reviews the symptoms.</p>':''}</div>`:''}</article>`).join('')}<div class="surface"><h2>Finish today's session</h2><p class="muted small">Your next session only advances after all five exercises are completed without unresolved symptom flags.</p><button class="button primary full" onclick="finishSession()" ${n===5&&!s.flags.some(Boolean)?'':'disabled'}>Finish session →</button></div><p class="fine">Based on <i>Living Life to the Fullest with Ehlers-Danlos Syndrome</i>, Level One Mat, printed pp. 43–55. This is a home tracking aid, not a replacement for PT evaluation. Timers track total exercise duration, not automatic hold/rest cues.</p>`}
function renderProgress(){let p=Math.min(100,Math.round((Math.min(180,target())-90)/90*100));document.getElementById('progress').innerHTML=`<div class="hero"><div class="eyebrow">Your journey</div><h1>Progress</h1><div class="muted">Slow and steady. Stability first.</div></div><div class="surface"><div class="row"><strong>Current exercise target</strong><span class="pill">${fmt(target())} / 3:00</span></div><div class="bar"><div style="width:${p}%"></div></div><p class="small muted">The next 10-second increase happens only when you finish a full session. At 3:00, complete all five and seek PT approval.</p><div class="row"><span class="badge">${s.history.length} sessions saved</span><span class="badge">${atGoal()?'Goal achieved':'Working toward goal'}</span></div></div><div class="surface"><h2>Session history</h2>${s.history.length?[...s.history].reverse().map((h,i)=>`<div class="entry row"><div><strong>${h.date}</strong><div class="small muted">All five exercises completed</div></div><span class="badge">${fmt(h.seconds)}</span></div>`).join(''):'<p class="muted small">No completed sessions yet. Finish your first session in Today and it will appear here.</p>'}</div><div class="surface"><h2>How progression works</h2><p class="small muted">1:30 → 1:40 → 1:50 → 2:00 → 2:10 → 2:20 → 2:30 → 2:40 → 2:50 → 3:00. The book describes adding 10 seconds per day. This app advances after completed sessions instead, so missed days never count as progress.</p><button class="button full" onclick="navigate('today')">Return to today's exercises</button></div>`}
function renderLevels(){let ready=eligible();document.getElementById('levels').innerHTML=`<div class="hero"><div class="eyebrow">Your roadmap</div><h1>Levels</h1><div class="muted">One progression at a time.</div></div><div class="surface"><div class="row"><div><div class="eyebrow">Current</div><h2 style="margin:5px 0">Level 1 Mat</h2><div class="small muted">SI joint + lumbar spine · five exercises</div></div><span style="font-size:30px">✓</span></div><div class="bar"><div style="width:${atGoal()?100:Math.round((target()-90)/90*100)}%"></div></div><button class="button full" onclick="navigate('today')">Open Level 1</button></div><div class="surface checkpoint"><div class="eyebrow">Physical therapist checkpoint</div><button class="flex ${s.approved?'approved':ready?'ready':''}" onclick="approval()" aria-label="Record physical therapist approval" ${!ready&&!s.approved?'disabled':''}>💪</button><h2>${s.approved?'Approved!':ready?'Ready for PT review':'PT approval locked'}</h2><p class="muted small">${s.approved?'Your approval has been recorded and Level 2 is unlocked.':ready?'You completed all five exercises at 3:00. Once your PT has reviewed your technique and approved progression, tap the flexing arm.':'Complete all five exercises at 3:00 in a symptom-free session to activate the flexing icon.'}</p>${ready?'<div class="notice" style="margin-top:9px">Tapping the icon will ask you to confirm that your PT approved progression. It does not substitute for the appointment.</div>':''}</div><div class="surface"><div class="row"><div><div class="eyebrow">${s.approved?'Unlocked':'Locked'}</div><h2 style="margin:5px 0">Level 2 Mat</h2><div class="small muted">Next progression · content coming in the next build</div></div><span style="font-size:28px">${s.approved?'🔓':'🔒'}</span></div></div><div class="surface"><h2>Data and reset</h2><p class="fine">Your history is stored locally in this browser, not synced to other devices. Keep this file in the same browser and location to retain progress. Clearing website data may erase it.</p><button class="button red full" onclick="resetAll()">Reset all progress</button></div>`}
function resetAll(){if(confirm('Delete all Level 1 sessions, notes and PT approval from this browser?')){stopTimer();s=fresh();persist();navigate('today')}}function escapeHTML(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function render(){['today','progress','levels'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==s.tab));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===s.tab));renderToday();renderProgress();renderLevels()}render();
</script></body></html>
