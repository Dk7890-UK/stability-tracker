'use strict';
const E=(id,name,how,feel,watch,cycle='5-second hold · controlled return',start=90,carry=false)=>({id,name,how,feel,watch,cycle,start,carry});
const BALL=E('squeeze','Ball squeezes','On your back, knees bent, feet hip-width apart. Place a soccer-ball-sized ball between your thighs. Squeeze for 5 seconds, release for 1 second.','Inner thighs.','Keep hips, knees and feet aligned. Move the ball lower between the thighs if knees hurt.','5 sec squeeze · 1 sec rest',180,true);
const CLAM=(id,color,start=90)=>E(id,`Clam · ${color} tubing`,`On your back with knees bent, tie ${color.toLowerCase()} tubing around both thighs. Open knees only a few inches, hold 5 seconds, then return slowly to hip-width neutral without letting knees touch.`,'Outer hips.','Do not let knees fall inward or open excessively. Tubing loop measures about 9–10 inches after tying.','5 sec open · controlled return',start);
const SWIM=E('swimmer','Prone swimmer','Lie face down with a pillow beneath hips and towel under forehead. With elbows bent and below shoulder height, lift one arm and the opposite leg slightly. Hold 5 seconds, lower, alternate.','Low and mid back.','Keep neck neutral, avoid excessive back arch or high arm/leg lifts. Ask PT about the supported-ball alternative.');
const LEVELS=[
{id:'m1',title:'Level 1 Mat',track:'Mat',pages:'43–55',intro:'Starting mat level. Five exercises, gradually increasing to 3 minutes each, subject to PT tolerance.',ex:[E('bridge','Bridging','Lie on your back, knees bent, feet hip-width apart. Squeeze glutes, lift hips, hold 5 seconds, lower and relax for 1 second.','Glutes and hamstrings.','Avoid letting hips rotate outward. If hamstrings cramp, squeeze glutes before lifting.'),E('march','Supine marches','On your back with knees bent, find a comfortable neutral pelvis and gently brace your abdomen. Lift one foot 1–2 inches, hold 5 seconds, lower and alternate. Keep abdominal brace through transitions.','Deep abdominal muscles and hip flexors.','Avoid pelvic rocking or painful hip pinching. The book provides heel-up and toe-up alternatives for hip symptoms.'),E('prone','Prone hip extension','Lie face down with a pillow under hips and towel roll under forehead. Lift one leg only until glutes contract, hold 5 seconds, then switch.','Low-back muscles and glutes.','Do not arch your low back, lift the leg too high, or turn your head sideways.'),E('squeeze','Ball squeezes','Lie on your back with knees bent and feet hip-width apart. Place a soccer-ball-sized ball between thighs. Squeeze for 5 seconds, rest 1 second.','Inner thighs.','Maintain neutral hip/knee/foot alignment; move ball lower on thighs if knees hurt.'),CLAM('yellow','Yellow')]},
{id:'m2',title:'Level 2 Mat',track:'Mat',pages:'56–66',intro:'Begins after Level 1 Mat is completed and PT approval. Level 1 Ball can begin 2–3 days later with separate PT supervision.',ex:[E('bridgeball','Bridges with ball squeeze','Place a soccer-ball-sized ball between thighs. Bridge up while squeezing glutes, squeeze the ball five separate times, lower and rest 1 second.','Glutes and inner thighs.','Five separate squeezes, not one long squeeze. Keep hips stable.'),E('kick','Supine kick outs','On your back with knees bent, maintain neutral pelvis and abdominal brace. Slowly straighten one knee without locking it, hold 5 seconds, return and alternate.','Abdominals, quads and hip flexors.','Keep a slight knee bend; ask PT about heel-touch alternative if back or hips hurt.'),SWIM,BALL,CLAM('green','Green')]},
{id:'b1',title:'Level 1 Ball',track:'Ball',pages:'67–73',intro:'Introduced 2–3 days after starting Level 2 Mat, after a PT checks ball safety. Use a hallway with walls for support.',ex:[E('heel','Seated alternating heel ups','Sit on physioball with feet hip-width apart, hands on thighs and abdominal brace. Slowly raise one heel, lower, then alternate without holding.','Calves, abdominals and back stabilizers.','Keep pelvis neutral. The book offers toe ups if ankles hurt.','Slow alternating · no hold'),E('ballbridge','Bridging with legs on ball','Lie on your back with calves on physioball, hands by your sides. Squeeze glutes, lift hips for 5 seconds, lower and rest 1 second.','Glutes and hamstrings.','Place calves, not heels, on ball. Avoid hip rotation or side-to-side sway.'),E('multifidus','Ball multifidus','Kneel on mat hugging physioball. Lift one knee about an inch while keeping that foot on mat, hold 5 seconds, then alternate.','Deep lower-back stabilizers.','Do not twist. PT may prescribe a hands-supported alternative before this version.')]},
{id:'m3',title:'Level 3 Mat',track:'Mat',pages:'74–82',intro:'Final mat level. Some exercises begin at 1 minute. After completion, maintenance is Mondays and Thursdays, per the book.',ex:[E('bridgekick','Bridges with kick outs','Hold a glute bridge while slowly extending one leg for 5 seconds, return, then extend the other leg without dropping hips.','Glutes, legs and core.','Avoid knee collapse and hip instability. Ask PT about heel-up alternative.',undefined,60),E('bug','Dying bug','On your back, hips and knees bent and arms toward ceiling. Brace abdomen. Extend opposite arm and leg, hold 5 seconds, return, alternate.','Deep abdominals and obliques.','Do not lock knees, arch back or push into hip pain. PT may use heel-touch alternative.',undefined,60),{...SWIM,start:180,carry:true},{...BALL,start:180,carry:true},CLAM('blue','Blue')]},
{id:'b2',title:'Level 2 Ball',track:'Ball',pages:'83–91',intro:'After Level 1 Ball reaches 3 minutes and PT approval. Continue appropriate mat work concurrently.',ex:[E('ballmarch','Seated on ball marching','Sit on physioball with feet hip-width apart and neutral pelvis. Lift one foot about 2 inches for 5 seconds, lower, alternate.','Hip flexors, abdominals and back stabilizers.','Avoid leaning, arching or losing balance.'),E('ballcross','Ball bridge · arms crossed','Lie on back with calves on ball, arms crossed over chest. Brace and bridge for 5 seconds, lower and rest 1 second.','Glutes, hamstrings and obliques.','Keep hips neutral; calves, not heels, rest on ball.'),E('rollout','Ball rollout bridge hold','Sit on ball and roll forward until shoulder blades rest on ball, knees bent about 90°. Keep neck neutral, hips raised, body level. Hold still.','Glutes, legs and trunk.','Neck must not carry weight; avoid sagging hips. Ask PT to check balance.','Static hold'),E('hugtoe','Hug ball · toe touching','Kneel while hugging ball. Extend one leg back with toe touching mat, hold 5 seconds, alternate.','Glutes and trunk stabilizers.','Avoid twisting and knee hyperextension; PT may use hands-supported variation.')]},
{id:'b3',title:'Level 3 Ball',track:'Ball',pages:'92–99',intro:'Final ball level. New exercises begin at 1 minute; after completion the book schedules maintenance on Mondays and Thursdays.',ex:[E('ballkick','Seated on ball kick outs','Sit on ball, feet hip-width apart, hands on thighs. Extend one leg with a slight knee bend, hold 5 seconds, alternate. Keep abdominal brace.','Quads and trunk stabilizers.','Do not lock knees or arch back.',undefined,60),E('rollheel','Ball rollouts with heel ups','Roll out on ball until shoulders are supported, neck neutral and hips level. Slowly raise and lower alternate heels without holding.','Core, glutes, hamstrings and calves.','Maintain stable table-top posture and safe balance.','Slow alternating · no hold',60),{...E('ballcross','Ball bridge · arms crossed','Lie on back with calves on ball, arms across chest. Lift hips for 5 seconds, lower for 1 second.','Glutes, hamstrings and obliques.','Keep hips neutral; calves supported on ball.'),start:180,carry:true},E('hugkick','Hug ball · kick outs','Kneel hugging physioball. Extend one leg behind you off the floor, hold 5 seconds, return, alternate.','Back and hip stabilizers.','Keep back from twisting or arching; only after PT demonstrates safe technique.',undefined,60)]},
{id:'n1',title:'Level 1 Neck & Upper Body',track:'Neck / upper body',pages:'100–102',intro:'Begins alongside Level 3 Ball, with PT approval. Two gentle supine stabilization exercises.',ex:[E('shoulderpress','Supine shoulder extensions','Lie on your back, knees bent and elbows at 90°. Press your upper arms gently into the mat, drawing shoulder blades together and down. Hold 5 seconds, release 1 second.','Muscles between the shoulder blades.','Use a pain-free squeeze, avoid arching the back and do not drive pressure through the elbows.'),E('chintuck','Supine chin tucks','Lie on your back, knees bent. With a comfortable pillow or no pillow, gently tuck your chin as though making a double chin while keeping eyes toward the ceiling. Hold 5 seconds, rest 1 second.','Muscles around the base of the skull and neck.','Stop for dizziness, nausea, headache or neurological symptoms and seek clinical assessment. Avoid forceful neck pressure.')]}

function alternateFor(e){let id=e.id;return ALT[id]||(/tyi/.test(id)?'Book describes supported physioball versions. PT determines setup and resistance.':/single/.test(id)?'Toe-touch balance alternative; PT must determine safe support.':'')}
function renderToday(){let l=current(),t=track(l.id),st=stat(l);document.getElementById('today').innerHTML=`<div class="eyebrow">${l.track==='Mat'||l.track==='Ball'?'SI joint & lumbar spine':l.track==='Neck / upper body'?'Neck, mid-back & upper body':l.track==='Lower body'?'Lower extremities':'Phase 2'} · ${l.track} track</div><h1>Today's session</h1><p class="muted small" style="margin-top:0">${esc(l.title)} · ${l.ex.length} exercises</p><div class="card"><div class="row"><strong>Session progress</strong><span class="pill">${st.done} / ${l.ex.length}</span></div><div class="bar"><span style="width:${st.done/l.ex.length*100}%"></span></div><div class="row small muted"><span>Exercises at prescribed goal</span><strong>${l.ex.filter(e=>secs(l,e)>=maxOf(e)).length} of ${l.ex.length} at goal</strong></div></div><div class="notice">Follow the exercise-specific rhythm and targets. Time-based exercises have timers; count repetitions and laps yourself. Increase only after a completed, tolerated session and PT guidance; if symptoms arise, stop and consult your PT.${l.id==='throw'?' Each throwing resistance tier is a separate progression. Have your PT direct each weight/band change and restart at 1:30 for each tier.':''}</div><div class="eyebrow" style="margin:25px 3px 8px">Exercises</div>${l.ex.map((e,i)=>`<article class="card exercise"><button class="exhead" onclick="expand('${e.id}')" aria-expanded="${state.open===e.id}"><span class="number">${String(i+1).padStart(2,'0')}</span><span style="flex:1"><strong style="font-size:16px">${esc(e.name)}</strong><div class="secondaryline">${targetLabel(e,secs(l,e))} · ${esc(e.cycle)}</div></span><span style="font-size:21px">${t.flags[e.id]?'<span class="flag">⚑</span>':t.done[e.id]?'<span class="check">✓</span>':state.open===e.id?'⌃':'⌄'}</span></button>${state.open===e.id?`<div class="exbody"><div class="clock" id="timer">${targetLabel(e,timer.exercise===e.id?timer.remaining:secs(l,e))}</div><div class="clocksub">Target · timed exercises use a timer; repetitions/laps use manual counting</div><div class="row" style="justify-content:center;margin-bottom:13px"><button class="chip" onclick="adjustTarget('${e.id}',-${stepOf(e)||10})">− Adjust</button><button class="chip" onclick="adjustTarget('${e.id}',${stepOf(e)||10})">+ Adjust</button></div><div class="actions"><button class="btn primary" onclick="startTimer('${e.id}')" ${kindOf(e)!=='time'?'disabled':''}>${kindOf(e)!=='time'?'Count manually':timer.running&&timer.exercise===e.id?'Pause':'▶ Start timer'}</button><button class="btn" onclick="resetTimer('${e.id}')" ${kindOf(e)!=='time'?'disabled':''}>Reset</button></div><div class="section">How to do it</div><p class="small">${esc(e.how)}</p><div class="section">What you should feel</div><p class="small">${esc(e.feel)}</p><div class="section">Watch for</div><p class="small">${esc(e.watch)}</p>${alternateFor(e)?`<div class="section">Book alternative</div><p class="small">${esc(alternateFor(e))}</p>`:''}<label for="n${e.id}">Notes for your PT</label><textarea id="n${e.id}" placeholder="Optional symptoms or technique notes" oninput="note('${e.id}',this.value)">${esc(t.notes[e.id]||'')}</textarea><div class="actions" style="margin-top:12px"><button class="btn ${t.flags[e.id]?'warn':''}" onclick="flag('${e.id}')">${t.flags[e.id]?'⚑ Clear flag':'⚑ Flag symptoms'}</button><button class="btn ${t.done[e.id]?'green':'primary'}" onclick="complete('${e.id}')">${t.done[e.id]?'✓ Done':'Mark complete'}</button></div>${t.flags[e.id]?'<p class="small" style="color:#a45b39">Flagged. Stop this movement and discuss symptoms with your PT before continuing.</p>':''}</div>`:''}</article>`).join('')}<div class="card"><h2>Finish session</h2><p class="small muted">Saves your workout, then advances targets by the exercise-specific increment. No advancement for flagged or incomplete sessions.</p><button class="btn primary full" onclick="finish()" ${allDone(l)?'':'disabled'}>Finish session →</button></div><div class="footer">Based on Kevin Muldowney's <i>Living Life to the Fullest with Ehlers-Danlos Syndrome</i>, printed pp. ${l.pages}. This is a tracking companion, not a substitute for supervised instruction. Exercise summaries are paraphrased; consult the book and your PT for modifications.</div>`}
function renderProgress(){let l=current(),t=track(l.id);document.getElementById('progress').innerHTML=`<div class="eyebrow">Your journey</div><h1>Progress</h1><p class="muted small">${esc(l.title)} · independent exercise targets</p><div class="card"><div class="row"><h2>Current level</h2><span class="pill">${t.history.length} sessions</span></div>${l.ex.map(e=>`<div style="margin:15px 0"><div class="row small"><strong>${esc(e.name)}</strong><span>${targetLabel(e,secs(l,e))} / ${targetLabel(e,maxOf(e))}</span></div><div class="bar" style="margin:8px 0"><span style="width:${Math.min(100,secs(l,e)/maxOf(e)*100)}%"></span></div></div>`).join('')}<p class="small muted">Level goal requires a completed session with every exercise at its prescribed target. Your PT must approve the next stage.</p></div><div class="card"><h2>Session history</h2>${t.history.length?[...t.history].reverse().map(h=>`<div class="history row"><div><strong>${esc(new Date(h.date).toLocaleDateString())}</strong><div class="tiny">${h.legacy?'Imported previous session':h.goal?'Target goal session':'Completed session'}${h.notes&&Object.keys(h.notes).length?' · PT notes saved':''}</div></div><span class="tag">${h.legacy?fmt(h.seconds):h.done+' exercises'}</span></div>`).join(''):'<p class="muted small">No sessions yet. Finish your first workout to begin your history.</p>'}</div><div class="card"><h2>Progression rules</h2><p class="small muted">The book uses different progressions: seconds for many upper-body exercises, repetitions or laps for lower-body exercises, and specific resistance changes. The tracker advances targets only after completed sessions. PT oversight determines actual readiness, technique and modifications.</p><button class="btn full" onclick="navigate('levels')">See progression roadmap</button></div>`}
function renderLevels(){document.getElementById('levels').innerHTML=`<div class="eyebrow">Your roadmap</div><h1>Levels</h1><p class="muted small">Tracks overlap where specified in the book. Each new stage needs PT approval; PT selects Phase 2 resistance and range.</p><div class="filters">${[['spine','SIJ / lumbar'],['neck','Neck / upper'],['lower','Lower body'],['phase','Phase 2']].map(([k,n])=>`<button class="chip ${((state.levelFilter||'spine')===k)?'selected':''}" onclick="setLevelFilter('${k}')">${n}</button>`).join('')}</div><div class="card"><h2>Exercise progressions</h2><p class="small muted">SIJ/lumbar, neck/upper-body, lower-body and Phase 2 tracks. Neck Level 1 overlaps Level 3 Ball; Phase 2 tracks can progress independently after PT clearance.</p>${ORDER.filter(id=>{let f=state.levelFilter||'spine';return f==='spine'?['m1','m2','b1','m3','b2','b3'].includes(id):f==='neck'?id.startsWith('n'):f==='lower'?id.startsWith('l'):['t1','t2','t3','throw','balance'].includes(id)}).map(id=>{let l=byId(id),un=unlocked(id),r=canApprove(id),active=state.active===id;return `<div class="level ${un?'':'locked'}"><div class="row"><div><strong>${esc(l.title)}</strong><div class="secondaryline">${l.ex.length} exercises · pp. ${l.pages}</div></div><span style="font-size:24px">${un&&id!=='m1'?'<span style="filter:none">💪</span>':un?'✓':'🔒'}</span></div><p class="small muted" style="margin:9px 0">${esc(l.intro)}</p>${un?`<button class="btn ${active?'green':'primary'} full" onclick="activate('${id}')">${active?'✓ Current stage':'Open exercises'}</button>`:`<div class="center"><button class="muscle ${r?'ready':''}" onclick="approve('${id}')" ${r?'':'disabled'} aria-label="Record PT approval for ${esc(l.title)}">💪</button><div class="tiny">${r?'Tap after your PT approves this level':'Grey until prerequisite is complete'}</div></div>`}${un&&id!=='m1'?`<div class="tiny" style="margin-top:9px">💪 PT approved ${esc(new Date(state.approvals[id]?.date||Date.now()).toLocaleDateString())}</div>`:''}</div>`}).join('')}</div><div class="notice amber">Physioball exercises require an in-person safety assessment before home use. Do not unlock them solely because a mat stage is complete.</div>`}
const MAINT={
spine:[['Dying Bug','Alternate: heel touches'],['Prone Swimmer','Alternate: leaning over ball'],['Bridges With Kickouts','Alternate: bridges with heel raises'],['Seated On Ball Kickouts',''],['Ball Roll Outs With Heel Ups','Alternate: toe ups'],['Bridging With Legs On Ball, Arms Across Chest',''],['Hugging The Ball With Kickouts','Alternate: hands on mat'],['Clam With Black Tubing',''],['Ball Squeezes','']],
neck:[['T, Y, I With Chin Tucks · 3 lb','Alternate: supported over ball'],['Shoulder Internal Rotation · black tubing',''],['Shoulder External Rotation · black tubing',''],['Full Can · 5 lb',''],['Shoulder Abduction · 4 lb',''],['Hand Ball Squeezes',''],['Four-Way Wrist · 3 lb',''],['Bicep Curl · 5 lb',''],['Triceps Push Downs · black tubing',''],['Criss-Cross Eyes',''],['Eyebrow Raises',''],['Ear Wiggles',''],['TMJ Isometrics','1 minute in each direction']],
lower:[['Side Stepping · black band','26 laps'],['Forward / Backward Walk · black band','26 laps'],['Hamstring Curls · black band','26 reps, hold counter'],['Single-Leg Heel And Toe Raises','50 reps each leg, hold counter'],['Deep Lunges','26 reps to tolerance'],['Step Lowering Forward · 8-inch step','26 reps each leg'],['Step Lowering Sideways · 8-inch step','26 reps each leg'],['Single-Leg Stance On Pillow, Eyes Open','2 min each leg; toe-touch alternative'],['Single-Leg Stance On Floor, Eyes Closed','2 min each leg; toe-touch alternative'],['Feet Together On Pillow, Eyes Closed','3 minutes'],['Recumbent Bike','20 minutes, PT-selected resistance']],
twist:[['PT-selected twisting variation','Standing Superman, Matrix, diagonal twisting (2 minutes each way), or table twisting']],
throw:[['Touch Down','PT-selected 0, 1, 2 or 3 lb'],['Throwing With Tubing','PT-selected yellow, red, green or blue'],['Shoulder Internal Rotation At 80°','PT-selected tubing; paired with external rotation'],['Shoulder External Rotation At 80°','PT-selected tubing; paired with internal rotation']],
balance:[['Stair Walking','PT-selected 1–2 flights and railing support'],['Star On Floor / Pillow','PT-selected support and surface'],['Tandem Walking','300 feet, with/without counter support'],['Foam Squares / Grass Walking','PT-selected support; grass 100–300 feet']]
};
function routineState(){if(!state.maintenance)state.maintenance={mode:'phase1',checks:{},dates:{}};let d=new Date().toLocaleDateString('en-CA');if(state.maintenance.checkDate!==d){state.maintenance.checks={};state.maintenance.checkDate=d;save()}return state.maintenance}
function setRoutineMode(mode){routineState().mode=mode;save();renderRoutine()}
function checkRoutine(key,val){routineState().checks[key]=val;save();renderRoutine()}
function clearRoutine(){if(!confirm('Clear today’s maintenance checkmarks? This does not affect your exercise history.'))return;routineState().checks={};save();renderRoutine()}
function routineDay(){return new Date().getDay()}
function renderRoutine(){let r=routineState(),day=routineDay(),phase2=r.mode==='phase2';let key=day===0?'rest':day===1||day===4?'spine':day===2||day===5?'neck':'lower';let titles={spine:'SIJ & lumbar maintenance',neck:'Neck & upper-body maintenance',lower:'Lower-body maintenance',rest:'Recovery day'};let parts=key==='rest'?[]:[key,...(phase2?[{spine:'twist',neck:'throw',lower:'balance'}[key]]:[])];let items=parts.flatMap(k=>MAINT[k].map(([name,note],i)=>({name,note,key:k+'_'+i})));let checked=items.filter(e=>r.checks[e.key]).length;let approved=goal(byId('m3'))&&goal(byId('b3'))&&goal(byId('n7'))&&goal(byId('l7'));let dayname=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][day];document.getElementById('routine').innerHTML=`<div class="eyebrow">Book reference · printed pp. ${phase2?'357–361':'323–325'}</div><h1>Maintenance</h1><p class="muted small">The book's final weekly schedule. Use this only after finishing the relevant stages and reviewing it with your PT.</p><div class="filters"><button class="chip ${!phase2?'selected':''}" onclick="setRoutineMode('phase1')">Phase 1</button><button class="chip ${phase2?'selected':''}" onclick="setRoutineMode('phase2')">Phase 2</button></div><div class="card"><div class="eyebrow">${dayname}</div><h2>${titles[key]}</h2><p class="small muted">${key==='rest'?'Rest, or recumbent bike for 20 minutes if you choose and your PT approves.':key==='spine'?'Monday and Thursday · exercises generally 3 minutes each':key==='neck'?'Tuesday and Friday · exercises generally 3 minutes each':'Wednesday and Saturday · generally 26 repetitions/laps, with exceptions below'}</p><div class="bar"><span style="width:${items.length?checked/items.length*100:0}%"></span></div><div class="tiny">${checked} of ${items.length} items checked</div></div>${!approved?'<div class="notice amber">Preview only: your maintenance plan is not unlocked. Finish the preceding stages and confirm the maintenance schedule with your PT before using this as a workout.</div>':''}${phase2?'<div class="notice">Phase 2 is not one fixed intensity: your PT selects the specific twisting variation, throwing resistance and balance supports. The options below are reference choices, not a prescription.</div>':''}${parts.map(k=>`<div class="card"><h2>${{spine:'SIJ / lumbar',neck:'Neck / upper body',lower:'Lower extremities',twist:'Twisting · PT choice',throw:'Throwing · PT choices',balance:'Balance · PT choices'}[k]}</h2>${MAINT[k].map(([name,note],i)=>`<label class="routineitem"><input type="checkbox" ${r.checks[k+'_'+i]?'checked':''} ${approved?'':'disabled'} onchange="checkRoutine('${k+'_'+i}',this.checked)"><span>${esc(name)}${note?`<small>${esc(note)}</small>`:''}</span></label>`).join('')}</div>`).join('')}${key==='rest'?'<div class="card"><h2>Rest and recovery</h2><p class="small muted">The book specifies Sunday as a rest day, with an optional 20-minute recumbent bike session.</p></div>':''}<div class="card"><h2>Weekly rhythm</h2><p class="small muted">Mon/Thu: lumbar ${phase2?'+ twisting':''}. Tue/Fri: upper body ${phase2?'+ throwing':''}. Wed/Sat: lower body ${phase2?'+ balance':''}. Sun: rest or optional bike. If you miss a day, the book says to pick up with the missed routine next time rather than skipping it.</p><button class="btn full" onclick="clearRoutine()">Clear checkmarks</button></div><div class="footer">This is a reference to the book’s final home program, not a recommendation to begin maintenance now. The checkboxes are a daily convenience, not a replacement for PT clearance or the active-level workout tracker.</div>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="eyebrow">Your app</div><h1>Settings</h1><p class="muted small">Private, local-first tracking · version 2.1</p><div class="card"><h2>Backup & restore</h2><p class="small muted">Your progress stays on this iPhone/browser. It does not sync to your Mac or GitHub. Export a backup regularly and save it to Files or iCloud Drive.</p><button class="btn primary full" onclick="backup()">↓ Export progress backup</button><button class="btn full" style="margin-top:10px" onclick="document.getElementById('restore').click()">↑ Restore from backup</button><p class="tiny">Restoring replaces the current app progress. Keep your previous backup until you've checked the import.</p></div><div class="card"><h2>Updates</h2><p class="small muted">Replace <code>index.html</code> in your GitHub repository to publish an update. This update retains the same schema 3 storage key and existing history. Back up before updating.</p><button class="btn full" onclick="location.reload()">Check for updated version</button></div><div class="card"><h2>Using the full protocol</h2><p class="small muted">The app is a condensed tracking companion and does not reproduce every illustration, alternate position, or clinical decision. Review the printed page ranges shown for each level with your PT before starting. Some Phase 2 exercises require individualized resistance, range, and safety decisions. Advanced stages are condensed summaries and must be checked against the book.</p></div><div class="card"><h2>Manage progress</h2><p class="small muted">A reset deletes all locally stored sessions, approvals, and notes for this app.</p><button class="btn warn full" onclick="resetAll()">Reset all progress</button></div><div class="footer">No login, no server-side records, no analytics. Browser storage can be lost if website data is cleared or Safari removes it. Export backups often.</div>`}
function backup(){let data={app:'Stability',format:3,exported:new Date().toISOString(),state};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='stability-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup exported. Save it in Files.')}
async function restoreBackup(ev){let file=ev.target.files?.[0];ev.target.value='';if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='Stability'||obj.format!==3||obj.state?.schema!==3||!obj.state.tracks||!obj.state.approvals)throw Error('Invalid backup');if(!confirm('Replace all current app progress with this backup?'))return;stop();state=obj.state;save();render();toast('Backup restored successfully.')}catch(e){alert('This file is not a valid Stability backup. No changes were made.')}}function resetAll(){if(confirm('Permanently delete all progress, notes and PT approvals stored in this browser?')){stop();state=fresh();save();navigate('today')}}function render(){if(!unlocked(state.active))state.active='m1';['today','progress','levels','routine','settings'].forEach(id=>document.getElementById(id).classList.toggle('hidden',state.tab!==id));document.querySelectorAll('.nav').forEach(n=>{n.classList.toggle('active',n.dataset.tab===state.tab);n.setAttribute('aria-current',n.dataset.tab===state.tab?'page':'false')});renderToday();renderProgress();renderLevels();renderRoutine();renderSettings()}save();render();document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer.running){timer.remaining=Math.max(0,Math.ceil((timer.end-Date.now())/1000));stop()}});
</script></body></html>
