'use strict';
const E=(id,name,how,feel,watch,cycle='5-second hold · controlled return',start=90,carry=false)=>({id,name,how,feel,watch,cycle,start,carry});
const BALL=E('squeeze','Ball squeezes','On your back, knees bent, feet hip-width apart. Place a soccer-ball-sized ball between your thighs. Squeeze for 5 seconds, release for 1 second.','Inner thighs.','Keep hips, knees and feet aligned. Move the ball lower between the thighs if knees hurt.','5 sec squeeze · 1 sec rest',180,true);
const CLAM=(id,color,start=90)=>E(id,`Clam · ${color} tubing`,`On your back with knees bent, tie ${color.toLowerCase()} tubing around both thighs. Open knees only a few inches, hold 5 seconds, then return slowly to hip-width neutral without letting knees touch.`,'Outer hips.','Do not let knees fall inward or open excessively. Tubing loop measures about 9–10 inches after tying.','5 sec open · controlled return',start);
const SWIM=E('swimmer','Prone swimmer','Lie face down with a pillow beneath hips and towel under forehead. With elbows bent and below shoulder height, lift one arm and the opposite leg slightly. Hold 5 seconds, lower, alternate.','Low and mid back.','Keep neck neutral, avoid excessive back arch or high arm/leg lifts. Ask PT about the supported-ball alternative.');
const LEVELS=[
{id:'m1',title:'Level 1 Mat',track:'Mat',pages:'43–55',intro:'Your starting level. Five exercises, gradually increasing to 3 minutes each.',ex:[E('bridge','Bridging','Lie on your back, knees bent, feet hip-width apart. Squeeze glutes, lift hips, hold 5 seconds, lower and relax for 1 second.','Glutes and hamstrings.','Avoid letting hips rotate outward. If hamstrings cramp, squeeze glutes before lifting.'),E('march','Supine marches','On your back with knees bent, find a comfortable neutral pelvis and gently brace your abdomen. Lift one foot 1–2 inches, hold 5 seconds, lower and alternate. Keep abdominal brace through transitions.','Deep abdominal muscles and hip flexors.','Avoid pelvic rocking or painful hip pinching. The book provides heel-up and toe-up alternatives for hip symptoms.'),E('prone','Prone hip extension','Lie face down with a pillow under hips and towel roll under forehead. Lift one leg only until glutes contract, hold 5 seconds, then switch.','Low-back muscles and glutes.','Do not arch your low back, lift the leg too high, or turn your head sideways.'),E('squeeze','Ball squeezes','Lie on your back with knees bent and feet hip-width apart. Place a soccer-ball-sized ball between thighs. Squeeze for 5 seconds, rest 1 second.','Inner thighs.','Maintain neutral hip/knee/foot alignment; move ball lower on thighs if knees hurt.'),CLAM('yellow','Yellow')]},
{id:'m2',title:'Level 2 Mat',track:'Mat',pages:'56–66',intro:'Begins after Level 1 Mat is completed and PT approval. Level 1 Ball can begin 2–3 days later with separate PT supervision.',ex:[E('bridgeball','Bridges with ball squeeze','Place a soccer-ball-sized ball between thighs. Bridge up while squeezing glutes, squeeze the ball five separate times, lower and rest 1 second.','Glutes and inner thighs.','Five separate squeezes, not one long squeeze. Keep hips stable.'),E('kick','Supine kick outs','On your back with knees bent, maintain neutral pelvis and abdominal brace. Slowly straighten one knee without locking it, hold 5 seconds, return and alternate.','Abdominals, quads and hip flexors.','Keep a slight knee bend; ask PT about heel-touch alternative if back or hips hurt.'),SWIM,BALL,CLAM('green','Green')]},
{id:'b1',title:'Level 1 Ball',track:'Ball',pages:'67–73',intro:'Introduced 2–3 days after starting Level 2 Mat, after a PT checks ball safety. Use a hallway with walls for support.',ex:[E('heel','Seated alternating heel ups','Sit on physioball with feet hip-width apart, hands on thighs and abdominal brace. Slowly raise one heel, lower, then alternate without holding.','Calves, abdominals and back stabilizers.','Keep pelvis neutral. The book offers toe ups if ankles hurt.','Slow alternating · no hold'),E('ballbridge','Bridging with legs on ball','Lie on your back with calves on physioball, hands by your sides. Squeeze glutes, lift hips for 5 seconds, lower and rest 1 second.','Glutes and hamstrings.','Place calves, not heels, on ball. Avoid hip rotation or side-to-side sway.'),E('multifidus','Ball multifidus','Kneel on mat hugging physioball. Lift one knee about an inch while keeping that foot on mat, hold 5 seconds, then alternate.','Deep lower-back stabilizers.','Do not twist. PT may prescribe a hands-supported alternative before this version.')]},
{id:'m3',title:'Level 3 Mat',track:'Mat',pages:'74–82',intro:'Final mat level. Some exercises begin at 1 minute. After completion, maintenance is Mondays and Thursdays, per the book.',ex:[E('bridgekick','Bridges with kick outs','Hold a glute bridge while slowly extending one leg for 5 seconds, return, then extend the other leg without dropping hips.','Glutes, legs and core.','Avoid knee collapse and hip instability. Ask PT about heel-up alternative.',undefined,60),E('bug','Dying bug','On your back, hips and knees bent and arms toward ceiling. Brace abdomen. Extend opposite arm and leg, hold 5 seconds, return, alternate.','Deep abdominals and obliques.','Do not lock knees, arch back or push into hip pain. PT may use heel-touch alternative.',undefined,60),{...SWIM,start:180,carry:true},{...BALL,start:180,carry:true},CLAM('blue','Blue')]},
{id:'b2',title:'Level 2 Ball',track:'Ball',pages:'83–91',intro:'After Level 1 Ball reaches 3 minutes and PT approval. Continue appropriate mat work concurrently.',ex:[E('ballmarch','Seated on ball marching','Sit on physioball with feet hip-width apart and neutral pelvis. Lift one foot about 2 inches for 5 seconds, lower, alternate.','Hip flexors, abdominals and back stabilizers.','Avoid leaning, arching or losing balance.'),E('ballcross','Ball bridge · arms crossed','Lie on back with calves on ball, arms crossed over chest. Brace and bridge for 5 seconds, lower and rest 1 second.','Glutes, hamstrings and obliques.','Keep hips neutral; calves, not heels, rest on ball.'),E('rollout','Ball rollout bridge hold','Sit on ball and roll forward until shoulder blades rest on ball, knees bent about 90°. Keep neck neutral, hips raised, body level. Hold still.','Glutes, legs and trunk.','Neck must not carry weight; avoid sagging hips. Ask PT to check balance.','Static hold'),E('hugtoe','Hug ball · toe touching','Kneel while hugging ball. Extend one leg back with toe touching mat, hold 5 seconds, alternate.','Glutes and trunk stabilizers.','Avoid twisting and knee hyperextension; PT may use hands-supported variation.')]},
{id:'b3',title:'Level 3 Ball',track:'Ball',pages:'92–99',intro:'Final ball level. New exercises begin at 1 minute; after completion the book schedules maintenance on Mondays and Thursdays.',ex:[E('ballkick','Seated on ball kick outs','Sit on ball, feet hip-width apart, hands on thighs. Extend one leg with a slight knee bend, hold 5 seconds, alternate. Keep abdominal brace.','Quads and trunk stabilizers.','Do not lock knees or arch back.',undefined,60),E('rollheel','Ball rollouts with heel ups','Roll out on ball until shoulders are supported, neck neutral and hips level. Slowly raise and lower alternate heels without holding.','Core, glutes, hamstrings and calves.','Maintain stable table-top posture and safe balance.','Slow alternating · no hold',60),{...E('ballcross','Ball bridge · arms crossed','Lie on back with calves on ball, arms across chest. Lift hips for 5 seconds, lower for 1 second.','Glutes, hamstrings and obliques.','Keep hips neutral; calves supported on ball.'),start:180,carry:true},E('hugkick','Hug ball · kick outs','Kneel hugging physioball. Extend one leg behind you off the floor, hold 5 seconds, return, alternate.','Back and hip stabilizers.','Keep back from twisting or arching; only after PT demonstrates safe technique.',undefined,60)]}
];
const ORDER=['m1','m2','b1','m3','b2','b3'];const KEY='stability_level1_v2';const NEWKEY='stability_v3';const fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;const date=()=>new Date().toLocaleDateString();const byId=id=>LEVELS.find(l=>l.id===id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){return {schema:3,tab:'today',active:'m1',open:'bridge',tracks:{m1:{counts:{},done:{},flags:{},notes:{},history:[],approved:false}},approvals:{},created:new Date().toISOString()}};
function load(){let x;try{x=JSON.parse(localStorage.getItem(NEWKEY)||'null')}catch(e){}if(x&&x.schema===3)return x;let y=fresh();try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&Array.isArray(old.history)){let t=y.tracks.m1;t.history=old.history.map(h=>({date:h.date,seconds:h.seconds,done:5,legacy:true}));let sec=Math.min(180,90+(old.session-1)*10);LEVELS[0].ex.forEach((e,i)=>{t.counts[e.id]=sec;t.done[e.id]=!!old.done?.[i];t.flags[e.id]=!!old.flags?.[i];t.notes[e.id]=old.notes?.[i]||''});if(old.approved){t.approved=true;y.approvals.m2={date:new Date().toISOString(),legacy:true}}}}catch(e){}return y}let state=load();let timer={id:null,running:false,exercise:null,remaining:0,end:0};function save(){try{localStorage.setItem(NEWKEY,JSON.stringify(state))}catch(e){toast('Unable to save. Check Safari storage settings.')}}function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.id);toast.id=setTimeout(()=>el.style.display='none',3100)}
function unlocked(id){if(id==='m1')return true;return !!state.approvals[id]}function track(id){return state.tracks[id]||(state.tracks[id]={counts:{},done:{},flags:{},notes:{},history:[],approved:false})}function secs(l,e){return track(l.id).counts[e.id]??e.start}function allDone(l){let t=track(l.id);return l.ex.every(e=>t.done[e.id]&&!t.flags[e.id])}function goal(l){return l.ex.every(e=>secs(l,e)>=180)&&track(l.id).history.some(h=>h.goal===true)}function current(){return byId(state.active)||LEVELS[0]}function navigate(tab){state.tab=tab;save();render();window.scrollTo(0,0)}function activate(id){if(!unlocked(id)){toast('PT approval required before starting this level.');return}stop();state.active=id;state.tab='today';state.open=byId(id).ex[0].id;save();render();window.scrollTo(0,0)}function expand(id){if(timer.running&&timer.exercise!==id){toast('Pause your timer first.');return}state.open=state.open===id?'':id;save();render()}function stop(){if(timer.id)clearInterval(timer.id);timer.id=null;timer.running=false}function startTimer(id){if(timer.running){timer.remaining=Math.max(0,Math.ceil((timer.end-Date.now())/1000));stop();render();return}let l=current(),e=l.ex.find(x=>x.id===id);if(timer.exercise!==id){timer.exercise=id;timer.remaining=secs(l,e)}timer.end=Date.now()+timer.remaining*1000;timer.running=true;timer.id=setInterval(()=>{timer.remaining=Math.max(0,Math.ceil((timer.end-Date.now())/1000));let el=document.getElementById('timer');if(el)el.textContent=fmt(timer.remaining);if(!timer.remaining){stop();render();toast('Timer finished. Check symptoms before marking complete.')}},200);render()}function resetTimer(id){stop();timer.exercise=id;timer.remaining=secs(current(),current().ex.find(e=>e.id===id));render()}function complete(id){let t=track(state.active);if(t.flags[id]){toast('Resolve symptoms with your PT before marking complete.');return}t.done[id]=!t.done[id];save();render()}function flag(id){let t=track(state.active);t.flags[id]=!t.flags[id];if(t.flags[id]){t.done[id]=false;stop()}save();render()}function note(id,value){track(state.active).notes[id]=value;save()}
function finish(){let l=current(),t=track(l.id);if(!allDone(l)){toast('Complete each exercise without unresolved symptom flags.');return}let achieved=l.ex.every(e=>secs(l,e)===180);t.history.push({date:new Date().toISOString(),seconds:Object.fromEntries(l.ex.map(e=>[e.id,secs(l,e)])),done:l.ex.length,goal:achieved});l.ex.forEach(e=>{if(secs(l,e)<180)t.counts[e.id]=Math.min(180,secs(l,e)+10);t.done[e.id]=false;t.flags[e.id]=false;t.notes[e.id]=''});stop();timer.exercise=null;save();navigate('progress');toast(achieved?'Level goal reached. Schedule PT review.':'Session saved. Next targets increased by 10 seconds.')}
function nexts(id){return ({m1:['m2'],m2:['b1','m3'],b1:['b2'],m3:[],b2:['b3'],b3:[]})[id]||[]}function canApprove(id){if(id==='m2')return goal(byId('m1'));if(id==='b1')return unlocked('m2');if(id==='m3')return goal(byId('m2'));if(id==='b2')return goal(byId('b1'));if(id==='b3')return goal(byId('b2'));return false}function approve(id){if(unlocked(id))return;if(!canApprove(id)){toast('Complete prerequisite progression first.');return}let title=byId(id).title;if(!confirm(`Has your physical therapist specifically approved starting ${title}? Only confirm after your PT has reviewed your readiness and technique.`))return;state.approvals[id]={date:new Date().toISOString()};track(id);save();render();toast('💪 PT approval recorded. '+title+' unlocked.')}function stat(l){let t=track(l.id),done=l.ex.filter(e=>t.done[e.id]).length;return {done,average:Math.round(l.ex.reduce((a,e)=>a+secs(l,e),0)/l.ex.length),goal:goal(l)}}
function renderToday(){let l=current(),t=track(l.id),st=stat(l);document.getElementById('today').innerHTML=`<div class="eyebrow">SI joint & lumbar spine · ${l.track} track</div><h1>Today's session</h1><p class="muted small" style="margin-top:0">${esc(l.title)} · ${l.ex.length} exercises</p><div class="card"><div class="row"><strong>Session progress</strong><span class="pill">${st.done} / ${l.ex.length}</span></div><div class="bar"><span style="width:${st.done/l.ex.length*100}%"></span></div><div class="row small muted"><span>Current average target</span><strong>${fmt(st.average)} / 3:00</strong></div></div><div class="notice">Follow the hold/return rhythm described for each exercise. Timers count total exercise duration. Increase only after a completed, tolerated session; if symptoms arise, stop and consult your PT.</div><div class="eyebrow" style="margin:25px 3px 8px">Exercises</div>${l.ex.map((e,i)=>`<article class="card exercise"><button class="exhead" onclick="expand('${e.id}')" aria-expanded="${state.open===e.id}"><span class="number">${String(i+1).padStart(2,'0')}</span><span style="flex:1"><strong style="font-size:16px">${esc(e.name)}</strong><div class="secondaryline">${fmt(secs(l,e))} · ${esc(e.cycle)}</div></span><span style="font-size:21px">${t.flags[e.id]?'<span class="flag">⚑</span>':t.done[e.id]?'<span class="check">✓</span>':state.open===e.id?'⌃':'⌄'}</span></button>${state.open===e.id?`<div class="exbody"><div class="clock" id="timer">${fmt(timer.exercise===e.id?timer.remaining:secs(l,e))}</div><div class="clocksub">Total exercise time · follow movement rhythm manually</div><div class="actions"><button class="btn primary" onclick="startTimer('${e.id}')">${timer.running&&timer.exercise===e.id?'Pause':'▶ Start timer'}</button><button class="btn" onclick="resetTimer('${e.id}')">Reset</button></div><div class="section">How to do it</div><p class="small">${esc(e.how)}</p><div class="section">What you should feel</div><p class="small">${esc(e.feel)}</p><div class="section">Watch for</div><p class="small">${esc(e.watch)}</p><label for="n${e.id}">Notes for your PT</label><textarea id="n${e.id}" placeholder="Optional symptoms or technique notes" oninput="note('${e.id}',this.value)">${esc(t.notes[e.id]||'')}</textarea><div class="actions" style="margin-top:12px"><button class="btn ${t.flags[e.id]?'warn':''}" onclick="flag('${e.id}')">${t.flags[e.id]?'⚑ Clear flag':'⚑ Flag symptoms'}</button><button class="btn ${t.done[e.id]?'green':'primary'}" onclick="complete('${e.id}')">${t.done[e.id]?'✓ Done':'Mark complete'}</button></div>${t.flags[e.id]?'<p class="small" style="color:#a45b39">Flagged. Stop this movement and discuss symptoms with your PT before continuing.</p>':''}</div>`:''}</article>`).join('')}<div class="card"><h2>Finish session</h2><p class="small muted">Saves your workout, then advances unfinished exercise targets by 10 seconds. No advancement for flagged or incomplete sessions.</p><button class="btn primary full" onclick="finish()" ${allDone(l)?'':'disabled'}>Finish session →</button></div><div class="footer">Based on Kevin Muldowney's <i>Living Life to the Fullest with Ehlers-Danlos Syndrome</i>, printed pp. ${l.pages}. This is a tracking companion, not a substitute for supervised instruction. Exercise summaries are paraphrased; consult the book and your PT for modifications.</div>`}
function renderProgress(){let l=current(),t=track(l.id);document.getElementById('progress').innerHTML=`<div class="eyebrow">Your journey</div><h1>Progress</h1><p class="muted small">${esc(l.title)} · independent exercise targets</p><div class="card"><div class="row"><h2>Current level</h2><span class="pill">${t.history.length} sessions</span></div>${l.ex.map(e=>`<div style="margin:15px 0"><div class="row small"><strong>${esc(e.name)}</strong><span>${fmt(secs(l,e))} / 3:00</span></div><div class="bar" style="margin:8px 0"><span style="width:${secs(l,e)/180*100}%"></span></div></div>`).join('')}<p class="small muted">Level complete after all exercises reach 3:00 and you finish a session at those targets.</p></div><div class="card"><h2>Session history</h2>${t.history.length?[...t.history].reverse().map(h=>`<div class="history row"><div><strong>${esc(new Date(h.date).toLocaleDateString())}</strong><div class="tiny">${h.legacy?'Imported previous session':h.goal?'Three-minute goal session':'Completed session'}</div></div><span class="tag">${h.legacy?fmt(h.seconds):h.done+' exercises'}</span></div>`).join(''):'<p class="muted small">No sessions yet. Finish your first workout to begin your history.</p>'}</div><div class="card"><h2>Progression rules</h2><p class="small muted">The book generally increases exercise duration by 10 seconds per day as tolerated. This tracker advances after a completed session, not just because a day passes. Some advanced exercises begin at 1:00 or carry over at 3:00, as specified by the book.</p><button class="btn full" onclick="navigate('levels')">See progression roadmap</button></div>`}
function renderLevels(){document.getElementById('levels').innerHTML=`<div class="eyebrow">Your roadmap</div><h1>Levels</h1><p class="muted small">Mat and ball progressions overlap. Each new stage needs its own PT approval.</p><div class="card"><h2>SIJ & lumbar spine</h2><p class="small muted">Select any unlocked stage to work on it. You can switch between approved mat and ball tracks.</p>${ORDER.map(id=>{let l=byId(id),un=unlocked(id),r=canApprove(id),active=state.active===id;return `<div class="level ${un?'':'locked'}"><div class="row"><div><strong>${esc(l.title)}</strong><div class="secondaryline">${l.ex.length} exercises · pp. ${l.pages}</div></div><span style="font-size:24px">${un?'✓':'🔒'}</span></div><p class="small muted" style="margin:9px 0">${esc(l.intro)}</p>${un?`<button class="btn ${active?'green':'primary'} full" onclick="activate('${id}')">${active?'✓ Current stage':'Open exercises'}</button>`:`<div class="center"><button class="muscle ${r?'ready':''}" onclick="approve('${id}')" ${r?'':'disabled'} aria-label="Record PT approval for ${esc(l.title)}">💪</button><div class="tiny">${r?'Tap after your PT approves this level':'Grey until prerequisite is complete'}</div></div>`}${un&&id!=='m1'?`<div class="tiny" style="margin-top:9px">💪 PT approved ${esc(new Date(state.approvals[id]?.date||Date.now()).toLocaleDateString())}</div>`:''}</div>`}).join('')}</div><div class="card"><h2>After SIJ / lumbar</h2><p class="small muted">The book next develops neck, mid-back and upper-extremity stabilization, then lower-extremity work. Those sections need a separate exercise-by-exercise review with your PT before being added to the interactive tracker.</p></div><div class="notice amber">Physioball exercises require an in-person safety assessment before home use. Do not unlock them solely because a mat stage is complete.</div>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="eyebrow">Your app</div><h1>Settings</h1><p class="muted small">Private, local-first tracking · version 1.0</p><div class="card"><h2>Backup & restore</h2><p class="small muted">Your progress stays on this iPhone/browser. It does not sync to your Mac or GitHub. Export a backup regularly and save it to Files or iCloud Drive.</p><button class="btn primary full" onclick="backup()">↓ Export progress backup</button><button class="btn full" style="margin-top:10px" onclick="document.getElementById('restore').click()">↑ Restore from backup</button><p class="tiny">Restoring replaces the current app progress. Keep your previous backup until you've checked the import.</p></div><div class="card"><h2>Updates</h2><p class="small muted">Replace <code>index.html</code> in your GitHub repository to publish an update. This app preserves locally saved data across updates as long as its storage remains available. Back up before updating.</p><button class="btn full" onclick="location.reload()">Check for updated version</button></div><div class="card"><h2>Manage progress</h2><p class="small muted">A reset deletes all locally stored sessions, approvals, and notes for this app.</p><button class="btn warn full" onclick="resetAll()">Reset all progress</button></div><div class="footer">No login, no server-side records, no analytics. Browser storage can be lost if website data is cleared or Safari removes it. Export backups often.</div>`}
function backup(){let data={app:'Stability',format:3,exported:new Date().toISOString(),state};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='stability-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup exported. Save it in Files.')}
async function restoreBackup(ev){let file=ev.target.files?.[0];ev.target.value='';if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='Stability'||obj.format!==3||obj.state?.schema!==3||!obj.state.tracks||!obj.state.approvals)throw Error('Invalid backup');if(!confirm('Replace all current app progress with this backup?'))return;stop();state=obj.state;save();render();toast('Backup restored successfully.')}catch(e){alert('This file is not a valid Stability backup. No changes were made.')}}function resetAll(){if(confirm('Permanently delete all progress, notes and PT approvals stored in this browser?')){stop();state=fresh();save();navigate('today')}}function render(){if(!unlocked(state.active))state.active='m1';['today','progress','levels','settings'].forEach(id=>document.getElementById(id).classList.toggle('hidden',state.tab!==id));document.querySelectorAll('.nav').forEach(n=>{n.classList.toggle('active',n.dataset.tab===state.tab);n.setAttribute('aria-current',n.dataset.tab===state.tab?'page':'false')});renderToday();renderProgress();renderLevels();renderSettings()}save();render();document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer.running){timer.remaining=Math.max(0,Math.ceil((timer.end-Date.now())/1000));stop()}});
</script></body></html>
